name: Backend bootstrap checks

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-bootstrap.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-bootstrap.yml"

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap unit tests and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:bootstrap:minimal
      - run: npm run build
